<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="100%" height="220">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>

    <style>
      .mono { font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 11px; font-weight: 600; fill: #6B7280; letter-spacing: 0.5px; }
      .box { fill: #0F172A; stroke: #1E293B; stroke-width: 1; }
      .box-highlight { fill: #0F172A; stroke: #2563EB; stroke-width: 1; }
      .node-hdr { font-size: 11px; font-weight: 600; fill: #F8FAFC; }
      .node-sub { font-size: 9.5px; fill: #94A3B8; }
      .metric-tag { font-size: 9px; font-weight: 600; fill: #10B981; }

      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      .flow-path {
        stroke-dasharray: 4, 4;
        animation: flow 1.2s linear infinite;
      }
    </style>
  </defs>

  <rect width="840" height="220" rx="10" fill="url(#archBg)" stroke="#1F2937" stroke-width="1" />

  <!-- Title Bar -->
  <g transform="translate(24, 24)">
    <text x="0" y="0" class="mono title">CASE STUDY ARCHITECTURE: NEUROSURGICAL MULTIMODAL RAG (AIIMS DELHI)</text>
    <rect x="710" y="-12" width="82" height="18" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
    <text x="751" y="0" text-anchor="middle" class="mono" font-size="9" font-weight="600" fill="#38BDF8">PRODUCTION</text>
  </g>

  <!-- Flow Steps -->
  <!-- STEP 1: Ingestion -->
  <g transform="translate(24, 52)">
    <rect width="170" height="138" rx="8" class="box" />
    <text x="16" y="24" class="sans node-hdr">1. Ingestion &amp; Vision</text>
    <text x="16" y="42" class="mono node-sub">&#8226; 30 FPS Surgical Video</text>
    <text x="16" y="60" class="mono node-sub">&#8226; Clinical Operative Text</text>
    <text x="16" y="78" class="mono node-sub">&#8226; OpenCV Frame Sampler</text>
    <text x="16" y="96" class="mono node-sub">&#8226; MediaPipe Step Tracker</text>
    
    <rect x="14" y="108" width="142" height="20" rx="4" fill="#111827" stroke="#1E293B" stroke-width="0.8" />
    <text x="22" y="122" class="mono" font-size="9" fill="#A78BFA">&#9654; CLIP Multimodal Embed</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="194" y1="121" x2="228" y2="121" stroke="#374151" stroke-width="1.5" />
  <line x1="194" y1="121" x2="228" y2="121" stroke="#60A5FA" stroke-width="1.5" class="flow-path" />

  <!-- STEP 2: Storage & Retrieval -->
  <g transform="translate(228, 52)">
    <rect width="170" height="138" rx="8" class="box" />
    <text x="16" y="24" class="sans node-hdr">2. Vector Search</text>
    <text x="16" y="42" class="mono node-sub">&#8226; ChromaDB Vector DB</text>
    <text x="16" y="60" class="mono node-sub">&#8226; Cross-Modal Indexing</text>
    <text x="16" y="78" class="mono node-sub">&#8226; Hybrid Text/Frame Scan</text>
    <text x="16" y="96" class="mono node-sub">&#8226; Temporal Alignment</text>

    <rect x="14" y="108" width="142" height="20" rx="4" fill="#111827" stroke="#1E293B" stroke-width="0.8" />
    <text x="22" y="122" class="mono metric-tag">&#9650; Re-ranking: 40% &#8594; 85%</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="398" y1="121" x2="432" y2="121" stroke="#374151" stroke-width="1.5" />
  <line x1="398" y1="121" x2="432" y2="121" stroke="#60A5FA" stroke-width="1.5" class="flow-path" />

  <!-- STEP 3: Async Serving Engine -->
  <g transform="translate(432, 52)">
    <rect width="170" height="138" rx="8" class="box-highlight" />
    <text x="16" y="24" class="sans node-hdr">3. Async Serving</text>
    <text x="16" y="42" class="mono node-sub">&#8226; FastAPI Async Backend</text>
    <text x="16" y="60" class="mono node-sub">&#8226; Concurrent Session Pool</text>
    <text x="16" y="78" class="mono node-sub">&#8226; Groq LPUs + Llama 3</text>
    <text x="16" y="96" class="mono node-sub">&#8226; Context Routing</text>

    <rect x="14" y="108" width="142" height="20" rx="4" fill="#111827" stroke="#1E293B" stroke-width="0.8" />
    <text x="22" y="122" class="mono metric-tag">&#9660; Query Latency: -40%</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="602" y1="121" x2="636" y2="121" stroke="#374151" stroke-width="1.5" />
  <line x1="602" y1="121" x2="636" y2="121" stroke="#60A5FA" stroke-width="1.5" class="flow-path" />

  <!-- STEP 4: Clinical Interface -->
  <g transform="translate(636, 52)">
    <rect width="178" height="138" rx="8" class="box" />
    <text x="16" y="24" class="sans node-hdr">4. Clinical Training</text>
    <text x="16" y="42" class="mono node-sub">&#8226; Neurosurgery Residents</text>
    <text x="16" y="60" class="mono node-sub">&#8226; Real-Time Surgical Q&amp;A</text>
    <text x="16" y="78" class="mono node-sub">&#8226; Synchronized Playback</text>
    <text x="16" y="96" class="mono node-sub">&#8226; Grounded Verification</text>

    <rect x="14" y="108" width="150" height="20" rx="4" fill="#111827" stroke="#1E293B" stroke-width="0.8" />
    <text x="22" y="122" class="mono" font-size="9" fill="#38BDF8">&#10003; AIIMS Validated</text>
  </g>
</svg>
